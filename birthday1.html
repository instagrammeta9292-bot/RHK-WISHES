
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise | RHK WISHES</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    padding: 20px;
    background: linear-gradient(135deg,#fff0f5,#f5e5ff);
    font-family: 'DM Sans', sans-serif;
    color: #382638;
}

.container {
    width: 100%;
    max-width: 430px;
    margin: 25px auto;
    padding: 28px 22px;
    background: white;
    border-radius: 22px;
    box-shadow: 0 12px 40px #9e689322;
}

.brand {
    text-align: center;
    color: #d05b91;
    font-weight: 800;
    letter-spacing: 3px;
    font-size: 12px;
    margin-bottom: 20px;
}

h1 {
    text-align: center;
    font-family: 'Playfair Display',serif;
    font-size: 30px;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #927e8e;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 25px;
}

label {
    display: block;
    font-size: 12px;
    font-weight: 800;
    margin: 17px 0 8px;
    color: #72596b;
}

input, textarea {
    width: 100%;
    border: 1px solid #ead8e4;
    background: #fffafd;
    border-radius: 11px;
    padding: 14px;
    font-family: inherit;
    font-size: 14px;
    outline: none;
}

textarea {
    resize: vertical;
    min-height: 95px;
}

input:focus, textarea:focus {
    border-color: #d05b91;
}

input[type="file"] {
    font-size: 12px;
}

.photo-preview {
    display: none;
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 13px;
    margin-top: 12px;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg,#e66b9c,#ad65d8);
    color: white;
    font-weight: 800;
    font-size: 14px;
    margin-top: 22px;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
    cursor: wait;
}

.secondary {
    background: #382638;
}

#shareResult {
    display: none;
    margin-top: 22px;
    padding: 16px;
    background: #fff2f7;
    border-radius: 13px;
}

#shareLink {
    word-break: break-all;
    font-size: 12px;
    color: #b44e80;
    margin-top: 10px;
}

#receiver {
    display: none;
}

.celebration {
    text-align: center;
    padding: 15px 0;
}

.celebration img {
    width: 100%;
    max-height: 300px;
    object-fit: cover;
    border-radius: 17px;
    margin: 20px 0;
}

.cake {
    font-size: 65px;
    margin: 15px 0;
}

.celebration h2 {
    font-family: 'Playfair Display',serif;
    font-size: 35px;
    color: #d05b91;
    line-height: 1.3;
}

.message {
    color: #806c7a;
    font-size: 15px;
    line-height: 1.9;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    margin-top: 20px;
}

.heart {
    font-size: 28px;
    margin-top: 22px;
}

.small {
    color: #aa91a2;
    font-size: 11px;
    margin-top: 25px;
}

.status {
    font-size: 13px;
    text-align: center;
    color: #927e8e;
    margin-top: 15px;
    line-height: 1.6;
}
</style>
</head>

<body>

<!-- SENDER EDITOR -->

<div class="container" id="editor">

    <div class="brand">RHK WISHES</div>

    <h1>Create a Birthday Surprise 🎁</h1>

    <p class="subtitle">
        Personalize your birthday template and create a surprise link to share.
    </p>

    <label>Birthday Person's Name</label>
    <input type="text" id="personName"
           placeholder="Enter their name" maxlength="60">

    <label>Your Birthday Message</label>
    <textarea id="personMessage"
              placeholder="Write your special birthday message..."
              maxlength="2000"></textarea>

    <label>Add Their Photo</label>
    <input type="file" id="personPhoto" accept="image/*">

    <img id="photoPreview" class="photo-preview">

    <button id="createButton" onclick="generateLink()">
        Create Birthday Link ✨
    </button>

    <p class="status" id="status"></p>

    <div id="shareResult">
        <b>Your birthday link is ready!</b>
        <p id="shareLink"></p>
        <button class="secondary" onclick="copyLink()">
            Copy Link
        </button>
        <button onclick="shareLink()">
            Share Birthday Surprise 💌
        </button>
    </div>

</div>


<!-- RECEIVER PAGE -->

<div class="container" id="receiver">

    <div class="brand">RHK WISHES</div>

    <div class="celebration">

        <div class="cake">🎂</div>

        <h2>
            Happy Birthday<br>
            <span id="receiverName"></span>!
        </h2>

        <img id="receiverPhoto" style="display:none;">

        <p class="message" id="receiverMessage"></p>

        <div class="heart">💖 🎈 🎉</div>

        <p class="small">MADE WITH ♥ BY RHK WISHES</p>

    </div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

// FIREBASE CONFIGURATION

const firebaseConfig = {
    apiKey: "AIzaSyBND3n2ag9qGZG5SJPOKNVYr2dHNLwoD7Y",
    authDomain: "rhk-music-24bbc.firebaseapp.com",
    databaseURL: "https://rhk-music-24bbc-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "rhk-music-24bbc",
    storageBucket: "rhk-music-24bbc.firebasestorage.app",
    messagingSenderId: "571438674805",
    appId: "1:571438674805:web:bcfe7856316b638d08193c",
    measurementId: "G-RF4GEDGP9N"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();


// CLOUDINARY SETTINGS

const CLOUDINARY_NAME = "nhy9lfkt";
const UPLOAD_PRESET = "rhk_upload";

let selectedFile = null;
let generatedURL = "";


// PHOTO PREVIEW

document.getElementById("personPhoto")
.addEventListener("change", function() {

    const file = this.files[0];

    if (!file) {
        selectedFile = null;
        return;
    }

    if (!file.type.startsWith("image/")) {
        alert("Please select an image.");
        this.value = "";
        return;
    }

    if (file.size > 8 * 1024 * 1024) {
        alert("Please select an image smaller than 8 MB.");
        this.value = "";
        return;
    }

    selectedFile = file;

    const preview = document.getElementById("photoPreview");
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
});


// UPLOAD PHOTO TO CLOUDINARY

async function uploadPhoto() {

    if (!selectedFile) return "";

    const formData = new FormData();

    formData.append("file", selectedFile);
    formData.append("upload_preset", UPLOAD_PRESET);

    const response = await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUDINARY_NAME}/image/upload`,
        {
            method: "POST",
            body: formData
        }
    );

    const result = await response.json();

    if (!response.ok || !result.secure_url) {
        throw new Error(
            result.error?.message || "Photo upload failed."
        );
    }

    return result.secure_url;
}


// CREATE BIRTHDAY LINK

async function generateLink() {

    const name = document.getElementById("personName").value.trim();
    const message = document.getElementById("personMessage").value.trim();

    const button = document.getElementById("createButton");
    const status = document.getElementById("status");

    if (!name) {
        alert("Please enter the birthday person's name.");
        return;
    }

    if (!message) {
        alert("Please write a birthday message.");
        return;
    }

    button.disabled = true;
    button.textContent = "Creating your surprise...";
    status.textContent = "Please wait. Saving your birthday surprise...";

    try {

        await auth.signInAnonymously();

        let photoURL = "";

        if (selectedFile) {
            status.textContent = "Uploading your photo...";
            photoURL = await uploadPhoto();
        }

        const wishRef = db.ref("wishes").push();

        const birthdayData = {
            name: name,
            message: message,
            photo: photoURL,
            createdAt: firebase.database.ServerValue.TIMESTAMP
        };

        await wishRef.set(birthdayData);

        const link = new URL(window.location.href);
        link.search = "";
        link.hash = "";
        link.searchParams.set("wish", wishRef.key);

        generatedURL = link.href;

        document.getElementById("shareLink").textContent = generatedURL;

        document.getElementById("shareResult").style.display = "block";

        status.textContent = "Your birthday surprise is ready! 🎉";

    } catch (error) {

        console.error(error);

        status.textContent = "Error: " + error.message;

    } finally {

        button.disabled = false;
        button.textContent = "Create Birthday Link ✨";

    }
}


// COPY LINK

async function copyLink() {

    if (!generatedURL) return;

    try {
        await navigator.clipboard.writeText(generatedURL);
        alert("Birthday link copied!");
    } catch (error) {
        prompt("Copy your birthday link:", generatedURL);
    }
}


// SHARE LINK

async function shareLink() {

    if (!generatedURL) return;

    if (navigator.share) {

        try {
            await navigator.share({
                title: "A Birthday Surprise!",
                text: "I made a special birthday surprise for you! 🎂",
                url: generatedURL
            });
        } catch (error) {
            if (error.name !== "AbortError") {
                alert("Please copy the link and share it.");
            }
        }

    } else {
        copyLink();
    }
}


// OPEN RECEIVER PAGE

async function openBirthday() {

    const params = new URLSearchParams(window.location.search);
    const id = params.get("wish");

    if (!id) return;

    document.getElementById("editor").style.display = "none";
    document.getElementById("receiver").style.display = "block";

    try {

        await auth.signInAnonymously();

        const snapshot = await db.ref("wishes/" + id).once("value");

        if (!snapshot.exists()) {
            throw new Error("This birthday surprise could not be found.");
        }

        const data = snapshot.val();

        document.getElementById("receiverName").textContent = data.name || "";
        document.getElementById("receiverMessage").textContent = data.message || "";

        if (data.photo) {

            const photo = document.getElementById("receiverPhoto");

            photo.onload = () => photo.style.display = "block";

            photo.onerror = () => photo.style.display = "none";

            photo.src = data.photo;
        }

    } catch (error) {

        console.error(error);

        document.getElementById("receiverName").textContent = "";
        document.getElementById("receiverMessage").textContent =
            "Sorry, this birthday surprise could not be loaded. Please check the link or try again later.";

    }
}


// START

openBirthday();

</script>

</body>
</html>
